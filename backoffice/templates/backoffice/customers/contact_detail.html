{% extends "base_admin.html" %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
    <div class="mb-8">
        <a href="{% url 'admin_contact_list' %}" class="text-[10px] font-black uppercase text-slate-400 hover:text-egmblue">
            <i class="fa-solid fa-arrow-left mr-2"></i> Retour à la liste
        </a>
    </div>

    <div class="grid md:grid-cols-3 gap-8">
        <div class="md:col-span-2 space-y-6">
            <div class="bg-white border border-slate-100 p-8 rounded-3xl">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <span class="text-[10px] font-black uppercase text-egmred italic tracking-widest">Message de</span>
                        <h1 class="text-3xl font-black uppercase text-slate-900 leading-none mt-1">{{ msg.name }}</h1>
                    </div>
                    <span class="badge bg-slate-100 border-none text-slate-500 font-bold text-[10px]">{{ msg.created_at|date:"d M Y" }}</span>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-8">
                    <a href="tel:{{ msg.phone }}" class="p-4 bg-slate-50 rounded-2xl flex flex-col items-center hover:bg-egmblue hover:text-white transition-all group">
                        <i class="fa-solid fa-phone mb-2 text-egmblue group-hover:text-white"></i>
                        <span class="text-xs font-black">{{ msg.phone }}</span>
                    </a>
                    <a href="https://wa.me/{{ msg.phone|cut:' ' }}" target="_blank" class="p-4 bg-green-50 rounded-2xl flex flex-col items-center hover:bg-green-600 hover:text-white transition-all group">
                        <i class="fa-brands fa-whatsapp mb-2 text-green-600 group-hover:text-white"></i>
                        <span class="text-xs font-black italic">WHATSAPP</span>
                    </a>
                </div>

                <div class="space-y-4">
                    <h3 class="text-[10px] font-black uppercase text-slate-400 border-b pb-2">Sujet & Message</h3>
                    <p class="font-bold text-slate-800 italic">" {{ msg.subject }} "</p>
                    <p class="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap">{{ msg.message }}</p>
                </div>
            </div>
        </div>

        <div class="md:col-span-1">
            <div class="bg-slate-900 p-8 rounded-3xl text-white sticky top-24">
                <h2 class="text-sm font-black uppercase italic mb-6 tracking-widest">Suivi Commercial</h2>
                <form method="POST" class="space-y-6">
                    {% csrf_token %}
                    
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text text-white/50 text-[10px] font-black uppercase">Statut</span></label>
                        <select name="status" class="select select-bordered bg-slate-800 border-slate-700 text-white w-full">
                            {% for code, label in msg.STATUS_CHOICES %}
                                <option value="{{ code }}" {% if msg.status == code %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-control w-full">
                        <label class="label"><span class="label-text text-white/50 text-[10px] font-black uppercase">Notes Internes</span></label>
                        <textarea name="admin_note" class="textarea bg-slate-800 border-slate-700 text-white h-32 text-xs" placeholder="Ex: Client rappelé, RDV fixé pour lundi...">{{ msg.admin_note }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-block bg-egmred hover:bg-white hover:text-egmred border-none text-white font-black uppercase italic">
                        Mettre à jour
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
