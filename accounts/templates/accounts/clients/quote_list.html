{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-10">
        <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tighter">Mes <span class="text-egmred">Demandes</span></h1>
        <a href="{% url 'request_quote' %}" class="btn bg-egmblue text-white border-none rounded-xl btn-sm md:btn-md">
            + Nouveau projet
        </a>
    </div>

    <div class="grid grid-cols-1 gap-4">
        {% for quote in quotes %}
        <a href="{% url 'quote_detail' quote.id %}" class="group bg-white border border-slate-200 p-6 rounded-2xl hover:border-egmblue transition-all shadow-sm flex items-center justify-between">
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3 mb-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">#00{{ quote.id }}</span>
                    <span class="text-[10px] font-black uppercase tracking-widest {% if quote.status == 'PROFORMA_ENVOYEE' %}text-egmblue{% elif quote.status == 'CLOTUREE' %}text-green-600{% else %}text-amber-500{% endif %}">
                        {{ quote.get_status_display }}
                    </span>
                </div>
                <h2 class="text-lg font-bold text-slate-800 uppercase truncate group-hover:text-egmblue">{{ quote.subject }}</h2>
                <p class="text-xs text-slate-400 font-medium">Soumis le {{ quote.created_at|date:"d M Y" }}</p>
            </div>
            <i class="fa-solid fa-arrow-right text-slate-200 group-hover:text-egmblue ml-4 transition-transform group-hover:translate-x-1"></i>
        </a>
        {% empty %}
        <div class="text-center py-20 border-2 border-dashed border-slate-100 rounded-3xl">
            <p class="text-slate-400 font-bold uppercase text-xs tracking-widest">Aucun projet pour le moment</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
