{% extends "base.html" %}

{% block title %}Sécurité | EGM Technologies{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10 animate-in slide-in-from-bottom-4 duration-500">
    <div class="card bg-slate-900 text-white shadow-2xl rounded-[2.5rem] overflow-hidden border-b-4 border-egmred">
        <div class="card-body p-8 md:p-12">
            <form method="post" class="space-y-5">
                {% csrf_token %}

                {% for field in form %}
                <div class="form-control">
                    <label class="label">
                        <span class="label-text text-[10px] font-black uppercase italic text-slate-400">{{ field.label }}</span>
                    </label>
                    
                    <div class="relative flex items-center">
                        <input type="password" 
                               name="{{ field.html_name }}" 
                               id="id_{{ field.html_name }}"
                               class="input input-bordered bg-white/5 border-white/10 text-white rounded-2xl focus:border-egmred focus:outline-none h-14 font-bold transition-all w-full pr-12"
                               placeholder="••••••••">
                        
                        <button type="button" 
                                onclick="togglePassword('id_{{ field.html_name }}', this)"
                                class="absolute right-4 text-slate-500 hover:text-egmred transition-colors focus:outline-none">
                            <i class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>

                    {% if field.errors %}
                        <p class="text-egmred text-[9px] font-black italic mt-1 uppercase">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="pt-6 flex flex-col gap-4">
                    <button type="submit" class="btn bg-egmred hover:bg-red-700 text-white border-none rounded-2xl h-14 font-black uppercase italic tracking-tighter shadow-lg shadow-red-900/40">
                        Confirmer le changement <i class="fa-solid fa-key ml-2"></i>
                    </button>
                    <a href="{% url 'client_profile' %}" class="btn btn-ghost text-slate-400 hover:text-white rounded-2xl font-black uppercase italic text-[10px]">
                        Annuler et retourner au profil
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = "password";
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
